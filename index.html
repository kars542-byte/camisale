<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camisale.work | Operación & Admin</title>
    
    <!-- SUPABASE CONFIGURATION -->
    <script>
        // Reemplaza con tus credenciales reales de Supabase
        const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
        const SUPABASE_ANON_KEY = 'TU-ANON-KEY-AQUI';
    </script>
    
    <style>
        /* ... (todo el CSS que ya tienes) ... */
    </style>
</head>
<body>
    <!-- ... (todo el HTML que ya tienes) ... -->
    
    <script>
        // ... (todo el JavaScript que ya tienes) ...
        
        // ============ SUPABASE SYNC ============
        class SupabaseSync {
            constructor() {
                this.baseUrl = SUPABASE_URL;
                this.anonKey = SUPABASE_ANON_KEY;
            }
            
            getHeaders() {
                return {
                    'apikey': this.anonKey,
                    'Authorization': `Bearer ${this.anonKey}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                };
            }
            
            // Test connection
            async testConnection() {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/users?select=count`, {
                        method: 'GET',
                        headers: this.getHeaders()
                    });
                    if (response.ok) {
                        console.log('✅ Supabase conectado');
                        return true;
                    }
                    return false;
                } catch (error) {
                    console.error('❌ Error:', error);
                    return false;
                }
            }
            
            // Fetch all users from Supabase
            async fetchUsers() {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/users?select=*&order=created_at.desc`, {
                        method: 'GET',
                        headers: this.getHeaders()
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching users:', error);
                    return [];
                }
            }
            
            // Create user in Supabase
            async createUser(userData) {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/users`, {
                        method: 'POST',
                        headers: this.getHeaders(),
                        body: JSON.stringify({
                            username: userData.username,
                            password_hash: userData.password,
                            full_name: userData.name,
                            role: userData.role,
                            building: userData.building || 'all',
                            status: 'active'
                        })
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error creating user:', error);
                    return null;
                }
            }
            
            // Delete user from Supabase
            async deleteUser(username) {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/users?username=eq.${username}`, {
                        method: 'DELETE',
                        headers: this.getHeaders()
                    });
                    return response.ok;
                } catch (error) {
                    console.error('Error deleting user:', error);
                    return false;
                }
            }
            
            // Fetch all tickets
            async fetchTickets() {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/tickets?select=*&order=created_at.desc`, {
                        method: 'GET',
                        headers: this.getHeaders()
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching tickets:', error);
                    return [];
                }
            }
            
            // Create ticket
            async createTicket(ticketData) {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/tickets`, {
                        method: 'POST',
                        headers: this.getHeaders(),
                        body: JSON.stringify({
                            ticket_number: ticketData.ticket_number,
                            title: ticketData.title,
                            description: ticketData.description || '',
                            building: ticketData.building,
                            status: ticketData.status || 'open',
                            priority: ticketData.priority || 'medium',
                            assignee: ticketData.assignee,
                            sla_status: ticketData.sla_status || 'ok',
                            sla_target: ticketData.sla_target || null
                        })
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error creating ticket:', error);
                    return null;
                }
            }
            
            // Update ticket status
            async updateTicketStatus(ticketNumber, status) {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/tickets?ticket_number=eq.${ticketNumber}`, {
                        method: 'PATCH',
                        headers: this.getHeaders(),
                        body: JSON.stringify({ status: status })
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error updating ticket:', error);
                    return null;
                }
            }
            
            // Fetch parking spots
            async fetchParkingSpots() {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/parking_spots?select=*`, {
                        method: 'GET',
                        headers: this.getHeaders()
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching parking:', error);
                    return [];
                }
            }
            
            // Update parking spot
            async updateParkingSpot(spotNumber, data) {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/parking_spots?spot_number=eq.${spotNumber}`, {
                        method: 'PATCH',
                        headers: this.getHeaders(),
                        body: JSON.stringify(data)
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error updating parking:', error);
                    return null;
                }
            }
            
            // Fetch reservations
            async fetchReservations() {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/area_reservations?select=*`, {
                        method: 'GET',
                        headers: this.getHeaders()
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching reservations:', error);
                    return [];
                }
            }
            
            // Create reservation
            async createReservation(reservationData) {
                try {
                    const response = await fetch(`${this.baseUrl}/rest/v1/area_reservations`, {
                        method: 'POST',
                        headers: this.getHeaders(),
                        body: JSON.stringify({
                            area_id: reservationData.area_id,
                            area_name: reservationData.area_name,
                            building: reservationData.building,
                            resident_name: reservationData.resident_name,
                            reservation_date: reservationData.reservation_date,
                            time_slot: reservationData.time_slot,
                            status: reservationData.status || 'confirmed'
                        })
                    });
                    return await response.json();
                } catch (error) {
                    console.error('Error creating reservation:', error);
                    return null;
                }
            }
            
            // Export users to CSV
            async exportUsersToCSV() {
                try {
                    const users = await this.fetchUsers();
                    let csv = 'Username,Nombre,Rol,Edificio,Estado,Creado\n';
                    users.forEach(u => {
                        csv += `${u.username},${u.full_name},${u.role},${u.building},${u.status},${u.created_at}\n`;
                    });
                    
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'usuarios_camisale.csv';
                    a.click();
                    URL.revokeObjectURL(url);
                    console.log('✅ CSV exportado');
                } catch (error) {
                    console.error('Error exporting:', error);
                }
            }
            
            // Sync all local data to Supabase
            async syncAllData() {
                console.log('🔄 Iniciando sincronización...');
                
                // Sync users
                const localUsers = state.users;
                for (const user of localUsers) {
                    await this.createUser({
                        username: user.username,
                        password: user.password,
                        name: user.name,
                        role: user.role,
                        building: user.building
                    });
                }
                console.log('✅ Usuarios sincronizados');
                
                // Sync tickets
                const localTickets = state.tickets;
                for (const ticket of localTickets) {
                    await this.createTicket({
                        ticket_number: ticket.id,
                        title: ticket.title,
                        building: ticket.building,
                        status: ticket.status,
                        priority: ticket.priority,
                        assignee: ticket.assignee,
                        sla_status: ticket.sla_status
                    });
                }
                console.log('✅ Tickets sincronizados');
                
                // Sync parking
                const localParking = state.parking;
                for (const spot of localParking) {
                    await this.updateParkingSpot(spot.number, {
                        building: spot.building,
                        status: spot.status,
                        current_resident: spot.resident || ''
                    });
                }
                console.log('✅ Parking sincronizado');
                
                // Sync reservations
                const localReservations = state.reservations;
                for (const res of localReservations) {
                    await this.createReservation({
                        area_id: res.area_id,
                        area_name: res.area_name,
                        building: res.building,
                        resident_name: res.resident,
                        reservation_date: res.date,
                        time_slot: res.time
                    });
                }
                console.log('✅ Reservas sincronizadas');
                
                console.log('🎉 Sincronización completa');
            }
        }
        
        // Initialize Supabase
        const supabase = new SupabaseSync();
        
        // Test connection on load
        document.addEventListener('DOMContentLoaded', async () => {
            await supabase.testConnection();
        });
    </script>
</body>
</html>
